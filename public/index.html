<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#315747" />
    <title>둘길 — 둘이 만드는 하루</title>
    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip" href="#app">본문으로 이동</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#home"
          ><span class="brand-mark">♡</span>둘길<span class="brand-en"
            >dulgil</span
          ></a
        >
        <p class="sidebar-caption">둘이 만드는 하루</p>
        <nav aria-label="주요 메뉴">
          <a href="#home" data-nav="home"><span>⌂</span>우리의 오늘</a
          ><a href="#plan" data-nav="plan"><span>↗</span>데이트 만들기</a
          ><a href="#courses" data-nav="courses"><span>♡</span>저장한 코스</a
          ><a href="#memories" data-nav="memories"><span>▧</span>추억 보관함</a
          ><a href="#anniversaries" data-nav="anniversaries"
            ><span>▦</span>기념일·일정</a
          >
        </nav>
        <a class="couple-widget" href="#couple"
          ><div class="avatar-pair"><span>나</span><span>너</span></div>
          <b>우리만의 공간</b><small>커플 연결 살펴보기 →</small></a
        >
        <div class="sidebar-bottom">
          <a href="#pages">◫ 전체 페이지</a><a href="#settings">⚙ 프로필·설정</a
          ><small>작은 순간이, 우리의 이야기가 되도록.</small>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <a class="mobile-brand" href="#home">♡ 둘길</a
          ><span class="breadcrumb" id="breadcrumb">우리의 오늘</span>
          <div class="top-actions">
            <span class="demo-badge">DESIGN DEMO</span
            ><a
              class="icon-button"
              href="#anniversaries"
              aria-label="기념일 보기"
              >◷</a
            ><a class="avatar" href="#settings" aria-label="프로필 설정">나</a>
          </div>
        </header>
        <main id="app" tabindex="-1"></main>
        <footer>
          © 둘길 · 둘이 만드는 하루 <a href="#privacy">개인정보·권한</a
          ><span>가상 장소 · 브라우저에만 저장되는 데모</span>
        </footer>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="모바일 메뉴">
      <a href="#home" data-mobile="home">⌂<small>홈</small></a
      ><a href="#plan" data-mobile="plan">↗<small>계획</small></a
      ><a href="#courses" data-mobile="courses">♡<small>코스</small></a
      ><a href="#memories" data-mobile="memories">▧<small>추억</small></a
      ><a href="#settings" data-mobile="settings">☷<small>더보기</small></a>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <span class="eyebrow">PLEASE CHECK</span>
        <h2 id="confirm-title">확인해주세요</h2>
        <p id="confirm-text"></p>
        <div class="actions">
          <button class="secondary" value="cancel">취소</button
          ><button class="danger" value="confirm">확인</button>
        </div>
      </form>
    </dialog>
    <script src="/vendor/leaflet.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
